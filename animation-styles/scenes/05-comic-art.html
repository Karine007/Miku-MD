<!doctype html>
<html><head><meta charset="utf-8"><title>05 Comic Art</title>
<link rel="stylesheet" href="base.css">
<style>
  #stage { background:#fff; }
  .tag { background:#ffe14d; color:#111; border:4px solid #111; border-radius:4px; box-shadow:5px 5px 0 #111; font-style:italic; }
  .ink { stroke:#111; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
</style></head>
<body><div id="stage" data-duration="6">
  <svg class="full" viewBox="0 0 540 960">
    <defs>
      <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="3.2" fill="#e83a3a"/></pattern>
      <pattern id="dotsB" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="2.2" fill="#1d4fbf"/></pattern>
      <pattern id="dotsY" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.6" fill="#f2b400"/></pattern>
    </defs>
    <!-- panel 1 -->
    <g>
      <rect x="18" y="90" width="504" height="520" fill="#ffe14d" class="ink"/>
      <rect x="18" y="90" width="504" height="520" fill="url(#dotsY)" opacity=".55"/>
      <g id="burst"></g>
      <g id="carG">
        <path class="ink" fill="#e83a3a" d="M60 470 L90 405 Q140 392 185 372 L245 322 Q300 305 360 322 L415 372 Q458 382 478 408 L480 470 Z"/>
        <path fill="url(#dots)" d="M60 470 L90 405 Q140 392 185 372 L480 410 L480 470 Z" opacity=".45"/>
        <path class="ink" fill="#9fe2ff" d="M200 372 L252 334 Q300 322 345 334 L390 372 Z"/>
        <path d="M260 345 L280 340 L250 368 Z" fill="#fff"/>
        <circle class="ink" cx="160" cy="475" r="42" fill="#222"/><circle class="ink" cx="400" cy="475" r="42" fill="#222"/>
        <circle cx="160" cy="475" r="16" fill="#ccc" stroke="#111" stroke-width="4"/><circle cx="400" cy="475" r="16" fill="#ccc" stroke="#111" stroke-width="4"/>
        <path d="M120 395 Q200 380 240 350" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g>
      <g class="ink" fill="none" stroke-width="5" id="speed">
        <path d="M30 380 l-0 0"/>
      </g>
    </g>
    <!-- speech bubble -->
    <g id="bubble">
      <path class="ink" fill="#fff" d="M300 130 h190 a20 20 0 0 1 20 20 v80 a20 20 0 0 1 -20 20 h-110 l-40 45 l8 -45 h-48 a20 20 0 0 1 -20 -20 v-80 a20 20 0 0 1 20 -20z"/>
      <text x="395" y="205" text-anchor="middle" font-family="DejaVu Sans" font-weight="900" font-style="italic" font-size="44" fill="#111">VROOM!</text>
    </g>
    <!-- panel 2 & 3 -->
    <rect x="18" y="630" width="245" height="300" fill="#fff" class="ink"/>
    <rect x="18" y="630" width="245" height="300" fill="url(#dotsB)" opacity=".5"/>
    <rect x="280" y="630" width="242" height="300" fill="#e83a3a" class="ink"/>
    <rect x="280" y="630" width="242" height="300" fill="url(#dotsY)" opacity=".35"/>
    <!-- driver face panel 2 -->
    <g transform="translate(140 790)">
      <circle r="70" fill="#ffd9b0" class="ink"/>
      <path d="M-70 -10 Q-60 -90 0 -85 Q60 -90 70 -10 Q40 -50 0 -45 Q-40 -50 -70 -10Z" fill="#222" class="ink"/>
      <rect x="-58" y="-20" width="50" height="30" rx="8" fill="#9fe2ff" class="ink"/><rect x="8" y="-20" width="50" height="30" rx="8" fill="#9fe2ff" class="ink"/>
      <path d="M-30 35 Q0 60 30 35" fill="#fff" class="ink"/>
    </g>
    <rect x="30" y="642" width="140" height="38" fill="#fff" class="ink" stroke-width="4"/>
    <text x="100" y="668" text-anchor="middle" font-family="DejaVu Sans" font-weight="900" font-size="18">MEANWHILE…</text>
    <!-- SFX panel 3 -->
    <g transform="translate(401 780) rotate(-12)">
      <text text-anchor="middle" font-family="DejaVu Sans" font-weight="900" font-style="italic" font-size="78" fill="#ffe14d" stroke="#111" stroke-width="7" paint-order="stroke" id="pow">ZOOM</text>
    </g>
    <g class="ink" fill="none" stroke-width="4">
      <path d="M300 860 l200 -10 M300 890 l180 -6 M300 700 l160 6"/>
    </g>
  </svg>
  <div class="tag">05 · COMIC ART</div>
</div>
<script>
const burst = document.getElementById('burst'), car = document.getElementById('carG'), speed = document.getElementById('speed'), pow = document.getElementById('pow');
function render(t) {
  // action-line starburst behind car
  let s = '';
  for (let i = 0; i < 36; i++) {
    const a = i / 36 * Math.PI * 2 + t * 0.15, r1 = 60, r2 = 420;
    const a2 = a + 0.06;
    s += `<path d="M270 410 L${270 + Math.cos(a) * r2} ${410 + Math.sin(a) * r2} L${270 + Math.cos(a2) * r2} ${410 + Math.sin(a2) * r2}Z" fill="${i % 2 ? '#fff' : '#ff9b2e'}" opacity=".7"/>`;
  }
  burst.innerHTML = `<g clip-path="inset(0)">${s}</g>`;
  const shake = Math.sin(t * 40) * 3;
  car.setAttribute('transform', `translate(${shake} ${Math.abs(Math.sin(t * 20)) * -4})`);
  let l = ''; for (let i = 0; i < 5; i++) { const y = 360 + i * 28, x = 30 + ((t * 300 + i * 37) % 30); l += `M${x} ${y} l${-(40 + i * 7)} 0 `; }
  speed.innerHTML = `<path d="${l}"/>`;
  pow.setAttribute('transform', `scale(${1 + 0.08 * Math.sin(t * 12)})`);
}
window.renderAt = render;
if (!window.__frozen) { const t0 = performance.now(); (function loop(){ render((performance.now() - t0) / 1000); requestAnimationFrame(loop); })(); }
</script>
<style>#burst{clip-path:inset(90px 18px 350px 18px);}</style>
</body></html>
