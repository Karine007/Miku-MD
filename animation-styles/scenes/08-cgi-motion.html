<!doctype html>
<html><head><meta charset="utf-8"><title>08 CGI Motion</title>
<link rel="stylesheet" href="base.css">
<style>
  .tag { background:#111c; color:#fff; border:1px solid #fff3; backdrop-filter:blur(8px); font-weight:500; letter-spacing:6px; }
  .cap { position:absolute; z-index:6; left:0; right:0; bottom:70px; text-align:center; color:#333; font:300 15px "DejaVu Sans"; letter-spacing:8px; opacity:.85; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body><div id="stage" data-duration="6">
  <canvas id="c"></canvas>
  <div class="cap">HOVER SERIES · CONCEPT 01</div>
  <div class="tag">08 · CGI MOTION</div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../vendor/RoomEnvironment.js';
import { makeRenderer, makeCar, boot } from './three-common.js';
const r = makeRenderer(document.getElementById('c'), { pixelRatio: 2 });
r.toneMappingExposure = 0.95;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color('#c9d4de');
scene.fog = new THREE.Fog('#c9d4de', 14, 40);
const cam = new THREE.PerspectiveCamera(38, 540 / 960, 0.1, 100);
const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(4, 9, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6; key.shadow.radius = 6;
scene.add(key);
scene.add(new THREE.HemisphereLight('#eaf2ff', '#b8a68a', 0.5));
const paint = new THREE.MeshPhysicalMaterial({ color: '#d8332a', metalness: 0.3, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.04 });
const glass = new THREE.MeshPhysicalMaterial({ color: '#111820', metalness: 0.2, roughness: 0.05, clearcoat: 1 });
const tire = new THREE.MeshStandardMaterial({ color: '#141414', roughness: 0.85 });
const rim = new THREE.MeshStandardMaterial({ color: '#e8e8e8', metalness: 1, roughness: 0.15 });
const car = makeCar({ body: paint, glass, tire, rim });
scene.add(car);
// thruster glow under each wheel
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(.25, '#ffd9a0'); gr.addColorStop(.6, '#ff7a3022'); gr.addColorStop(1, '#0000'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const jets = car.wheels.map(w => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.set(1.1, 1.1, 1); s.position.set(w.position.x, 0.0, w.position.z); car.add(s);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.03, 0.9, 24, 1, true), new THREE.MeshBasicMaterial({ color: '#ffe4c0', transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
  beam.position.set(w.position.x, -0.45, w.position.z); car.add(beam);
  const pl = new THREE.PointLight('#ffb070', 3, 3); pl.position.set(w.position.x, -0.3, w.position.z); car.add(pl);
  return s;
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhysicalMaterial({ color: '#d9c9a8', roughness: 0.6, metalness: 0, clearcoat: 0.3 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// horizon band (golden strip like a desert road)
const band = new THREE.Mesh(new THREE.PlaneGeometry(200, 3), new THREE.MeshStandardMaterial({ color: '#d4a640', roughness: 0.4, metalness: 0.4 }));
band.rotation.x = -Math.PI / 2; band.position.set(0, 0.01, -8); scene.add(band);
function render(t) {
  const h = 1.7 + Math.sin(t * 1.6) * 0.15;
  car.position.y = h; car.rotation.y = -0.35 + t * 0.12; car.rotation.z = Math.sin(t * 1.3) * 0.04;
  jets.forEach((j, i) => { const k = 1 + Math.sin(t * 30 + i) * 0.08; j.scale.set(k, k, 1); });
  const a = 0.9 + t * 0.05;
  cam.position.set(Math.sin(a) * 15, 2.6, Math.cos(a) * 15); cam.lookAt(0, 1.3, 0);
  r.render(scene, cam);
}
boot(render);
</script></body></html>
