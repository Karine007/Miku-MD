<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>18 Days in the Radio Tower — flat cartoon</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #121315; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #film { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      /* preload both faces so the canvas can use them on the first frame */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="331.4" data-width="1920" data-height="1080">
      <canvas id="film" class="clip" data-start="0" data-duration="331.4" data-track-index="0" width="1920" height="1080"></canvas>
      <!-- music + effects (src/make_sounds.py) and Gemini TTS narration (src/make_voice.py) -->
      <audio id="a-mix" src="assets/soundtrack.wav" data-start="0" data-duration="331.4" data-volume="0.45" data-track-index="10"></audio>
      <audio id="a-voice" src="assets/voiceover.wav" data-start="0" data-duration="331.4" data-volume="1" data-track-index="11"></audio>
    </div>
    <script>
      const film = window.CartoonFilm.create(document.getElementById('film'));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: window.FILM.total, duration: window.FILM.total, ease: 'none', onUpdate: () => film.render(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      const draw = () => film.render(clock.t);

      tl.seek(0); draw();
    </script>
  </body>
</html>
