<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Would You Still Love Me? — brick sketch</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #101114; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #film, #overlay { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1080" data-height="1920">
      <canvas id="film" class="clip" data-start="0" data-duration="26" data-track-index="0" width="1080" height="1920"></canvas>
      <canvas id="overlay" class="clip" data-start="0" data-duration="26" data-track-index="1" width="1080" height="1920"></canvas>
      <!-- Gemini TTS voices (Kore, Puck) + synthesized music/effects (src/make_audio.py) -->
      <audio id="a-mix" src="assets/mix.wav" data-start="0" data-duration="26" data-volume="1" data-track-index="10"></audio>
    </div>
    <script>
      const film = window.SofaFilm.create(document.getElementById('film'), document.getElementById('overlay'));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 26, duration: 26, ease: 'none', onUpdate: () => film.render(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0); film.render(0);
    </script>
  </body>
</html>
