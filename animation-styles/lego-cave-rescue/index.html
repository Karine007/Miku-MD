<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Trapped 148 ft Under — brick film</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <script src="assets/timemap.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d12; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "DejaVu Sans", sans-serif; }
      #film { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #caption {
        position: absolute; left: 50%; top: 1290px; width: 960px; transform: translateX(-50%);
        text-align: center; color: #fff; font-weight: 900; font-size: 62px; line-height: 1.15;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill; text-shadow: 0 7px 0 #000;
      }
      #caption .hl { color: #ffd400; }
      #card {
        position: absolute; left: 0; right: 0; top: 230px; text-align: center; color: #fff;
        font-weight: 900; font-size: 74px; letter-spacing: 6px;
        -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000;
      }
      #air { position: absolute; left: 60px; top: 150px; display: flex; align-items: center; gap: 18px; color: #fff; font-weight: 900; font-size: 40px; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }
      #airBar { width: 300px; height: 34px; border: 5px solid #000; border-radius: 10px; background: #263238; overflow: hidden; }
      #airFill { height: 100%; width: 50%; background: #ffd400; }
      #bubble {
        position: absolute; left: 90px; top: 640px; padding: 26px 40px; background: #fff; color: #111;
        border: 7px solid #111; border-radius: 40px; font-weight: 900; font-size: 54px; white-space: nowrap; transform-origin: 70% 120%;
      }
      #bubble::after { content: ""; position: absolute; right: 120px; bottom: -58px; border: 30px solid transparent; border-top: 34px solid #111; }
      #fade { position: absolute; inset: 0; background: #000; }
      #end { position: absolute; left: 0; right: 0; top: 860px; text-align: center; color: #ffd400; font-weight: 900; font-size: 92px; -webkit-text-stroke: 9px #b71c1c; paint-order: stroke fill; text-shadow: 0 10px 0 #5a0000; }
      #end small { display: block; color: #fff; font-size: 44px; -webkit-text-stroke: 5px #000; text-shadow: none; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="95.177" data-width="1080" data-height="1920">
      <canvas id="film" class="clip" data-start="0" data-duration="95.177" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="fade" class="clip" data-start="0" data-duration="95.177" data-track-index="1"></div>
      <div id="air" class="clip" data-start="0" data-duration="95.177" data-track-index="2">AIR <div id="airBar"><div id="airFill"></div></div></div>
      <div id="card" class="clip" data-start="0" data-duration="95.177" data-track-index="3"></div>
      <div id="bubble" class="clip" data-start="0" data-duration="95.177" data-track-index="4">¿HOLA? ¿HAY ALGUIEN AQUÍ?</div>
      <div id="caption" class="clip" data-start="0" data-duration="95.177" data-track-index="5"></div>
      <div id="end" class="clip" data-start="0" data-duration="95.177" data-track-index="6">TO BE CONTINUED…<small>Part 2 coming soon</small></div>
      <!-- full soundtrack (music + effects), synthesized by src/make_sounds.py -->
      <audio id="a-mix" src="assets/soundtrack.wav" data-start="0" data-duration="95.177" data-volume="0.5" data-track-index="10"></audio>
      <!-- narrator: Gemini TTS (voice "Charon"), shout: voice "Puck" — built by src/make_voice.py -->
      <audio id="a-voice" src="assets/voiceover.wav" data-start="0" data-duration="95.177" data-volume="1" data-track-index="11"></audio>
    </div>
    <script>
      const $ = id => document.getElementById(id);
      const film = window.LegoFilm.create($('film'), { caption: $('caption'), card: $('card'), air: $('air'), airFill: $('airFill'), bubble: $('bubble'), end: $('end'), fade: $('fade') });
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      // film time -> story time: beats are stretched so each voice line fits (see assets/timemap.json)
      const TM = window.TIMEMAP;
      const story = T => { for (const [a, b, s0, s1] of TM.segments) if (T <= b) return s0 + (s1 - s0) * Math.max(0, T - a) / (b - a); return 60; };
      tl.to(clock, { t: TM.total, duration: TM.total, ease: 'none', onUpdate: () => film.render(story(clock.t)) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
      film.render(0);
    </script>
  </body>
</html>
