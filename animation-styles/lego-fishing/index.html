<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Gone Fishing — brick film</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      :root { --ink: #ffd500; --edge: #b71c1c; --font-display: "DejaVu Sans", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #8fd3ff; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); }
      #film { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .title {
        position: absolute; left: 0; right: 0; text-align: center; color: var(--ink);
        font-weight: 900; font-size: 120px; letter-spacing: 2px;
        -webkit-text-stroke: 10px var(--edge); paint-order: stroke fill;
        text-shadow: 0 12px 0 #7f0000, 0 18px 30px #0006;
      }
      .sub { font-size: 64px; -webkit-text-stroke: 7px #0d1b4a; color: #fff; text-shadow: 0 8px 0 #0d1b4a; }
      #t1 { top: 300px; } #t2 { top: 300px; } #t3 { top: 760px; font-size: 150px; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <canvas id="film" class="clip" data-start="0" data-duration="10" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="t1" class="title clip" data-start="0" data-duration="2.4" data-track-index="1">GONE<br>FISHING</div>
      <div id="t2" class="title sub clip" data-start="6.2" data-duration="1.6" data-track-index="1">Later that night…</div>
      <div id="fade" class="clip" data-start="9.6" data-duration="0.4" data-track-index="2"></div>
      <div id="t3" class="title clip" data-start="9.55" data-duration="0.45" data-track-index="3">THE END</div>

      <!-- sound: all synthesized by src/make_sounds.py -->
      <audio id="a-music" src="sounds/music.wav" data-start="0" data-duration="10" data-volume="0.55" data-fade-out="0.6" data-track-index="10"></audio>
      <audio id="a-day" src="sounds/day.wav" data-start="0" data-duration="6.5" data-volume="0.6" data-fade-out="0.8" data-track-index="11"></audio>
      <audio id="a-steps1" src="sounds/steps.wav" data-start="0.45" data-duration="2.4" data-volume="0.7" data-track-index="12"></audio>
      <audio id="a-cast" src="sounds/cast.wav" data-start="3.0" data-duration="1.2" data-volume="0.9" data-track-index="13"></audio>
      <audio id="a-reel" src="sounds/reel.wav" data-start="4.3" data-duration="0.9" data-volume="0.7" data-track-index="14"></audio>
      <audio id="a-splash" src="sounds/splash.wav" data-start="4.95" data-duration="0.9" data-volume="0.9" data-track-index="15"></audio>
      <audio id="a-tada" src="sounds/tada.wav" data-start="5.4" data-duration="1.2" data-volume="0.6" data-track-index="16"></audio>
      <audio id="a-night" src="sounds/night.wav" data-start="5.9" data-duration="4.1" data-volume="0.7" data-fade-in="0.5" data-track-index="17"></audio>
      <audio id="a-steps2" src="sounds/steps.wav" data-start="7.3" data-duration="2.2" data-volume="0.6" data-track-index="18"></audio>
      <audio id="a-door" src="sounds/door.wav" data-start="9.25" data-duration="0.6" data-volume="0.8" data-track-index="19"></audio>
    </div>
    <script>
      // The 3D scene is a pure function of time: the GSAP tween's onUpdate renders the frame the runtime seeks to.
      const film = window.LegoFilm.create(document.getElementById('film'));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 10, duration: 10, ease: 'none', onUpdate: () => film.render(clock.t) }, 0);
      tl.fromTo('#t1', { scale: 0.3, opacity: 0, y: -80 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2.2)' }, 0.1);
      tl.to('#t1', { opacity: 0, y: -60, duration: 0.4 }, 1.9);
      tl.fromTo('#t2', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4 }, 6.2);
      tl.to('#t2', { opacity: 0, duration: 0.35 }, 7.4);
      tl.fromTo('#fade', { opacity: 0 }, { opacity: 0.75, duration: 0.3 }, 9.6);
      tl.fromTo('#t3', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, 9.6);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
      film.render(0);
    </script>
  </body>
</html>
