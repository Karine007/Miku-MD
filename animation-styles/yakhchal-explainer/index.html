<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Yakhchal — 3D explainer</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #8fcdf2; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #film, #overlay { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="87.97" data-width="1080" data-height="1920">
      <canvas id="film" class="clip" data-start="0" data-duration="87.97" data-track-index="0" width="1080" height="1920"></canvas>
      <canvas id="overlay" class="clip" data-start="0" data-duration="87.97" data-track-index="1" width="1080" height="1920"></canvas>
      <!-- Gemini TTS narration (voice "Puck") + synthesized music/effects -->
      <audio id="a-mix" src="assets/soundtrack.wav" data-start="0" data-duration="87.97" data-volume="0.5" data-track-index="10"></audio>
      <audio id="a-voice" src="assets/voiceover.wav" data-start="0" data-duration="87.97" data-volume="1" data-track-index="11"></audio>
    </div>
    <script>
      const film = window.YakhchalFilm.create(document.getElementById('film'), document.getElementById('overlay'));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: window.FILM.total, duration: window.FILM.total, ease: 'none', onUpdate: () => film.render(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0); film.render(0);
    </script>
  </body>
</html>
