<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:Nunito;font-weight:900;src:url(node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2) format('woff2');}
@font-face{font-family:Nunito;font-weight:800;src:url(node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2');}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#9fd6ff}
#c{position:absolute;inset:0;width:1080px;height:1920px}
#ui{position:absolute;inset:0;pointer-events:none;font-family:Lilita,sans-serif;color:#fff}
.hud{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.box{background:#fff;border:5px solid #1d232b;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.25);color:#1d232b;height:96px;display:flex;align-items:center}
.box.day{width:118px;flex-direction:column;justify-content:center}
.box.pop{width:330px;padding:0 18px;box-sizing:border-box;gap:14px;position:relative}
.lbl{font-family:Nunito;font-weight:900;font-size:19px;letter-spacing:1px;color:#555}
.num{font-family:Nunito;font-weight:900;font-size:44px;line-height:44px}
.pill{position:absolute;top:262px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #1d232b;border-radius:30px;color:#1d232b;font-family:Nunito;font-weight:900;font-size:21px;padding:5px 18px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tag{position:absolute;top:-22px;right:-14px;background:#ffcc33;border:4px solid #1d232b;border-radius:10px;font-family:Nunito;font-weight:900;font-size:17px;padding:1px 9px;transform:rotate(6deg);opacity:0}
.cap{position:absolute;left:40px;right:40px;text-align:center;font-size:84px;line-height:92px;text-transform:uppercase;
  -webkit-text-stroke:14px #15191f;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35);opacity:0;transform-origin:50% 50%}
.cap b{color:#ffcc2e;font-weight:400}
.cap .sub{display:block;font-family:Nunito;font-weight:900;font-size:40px;line-height:52px;-webkit-text-stroke:9px #15191f;margin-top:6px}
.cap.top{top:330px}
.cap.bot{top:1240px}
.label{position:absolute;background:#fff;border:4px solid #1d232b;border-radius:14px;color:#1d232b;font-family:Nunito;font-weight:900;font-size:28px;padding:4px 16px;opacity:0;white-space:nowrap}
svg.lines{position:absolute;inset:0;width:1080px;height:1920px}
.grid{position:absolute;top:560px;left:50%;display:grid;grid-template-columns:230px 230px;gap:26px;transform:translateX(-50%)}
.card{width:230px;height:200px;background:#fff;border:5px solid #1d232b;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#1d232b;font-family:Nunito;font-weight:900;font-size:24px;opacity:0;box-sizing:border-box}
.card .ic{font-size:76px;line-height:80px;font-family:'Noto Color Emoji'}
.steps{position:absolute;top:640px;left:50%;transform:translateX(-50%);width:760px;display:flex;flex-direction:column;gap:22px}
.step{background:#fff;border:5px solid #1d232b;border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:20px;padding:14px 22px;color:#1d232b;opacity:0}
.step .n{width:62px;height:62px;border-radius:50%;color:#fff;font-family:Nunito;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center;flex:none;border:4px solid #1d232b}
.step .t{font-family:Nunito;font-weight:900;font-size:34px;line-height:38px}
.step .s{font-family:Nunito;font-weight:800;font-size:24px;color:#666}
.comment{position:absolute;top:1010px;left:50%;width:840px;margin-left:-420px;background:#fff;border:5px solid #1d232b;border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:18px;padding:16px 22px;box-sizing:border-box;color:#1d232b;opacity:0}
.comment .q{font-family:Nunito;font-weight:800;font-size:28px;line-height:34px;flex:1}
.comment .h{font-family:Nunito;font-weight:900;font-size:26px;color:#e8334f;text-align:center;width:90px}
.pin{position:absolute;width:76px;height:96px;margin-left:-38px;margin-top:-96px;opacity:0}
.flash{position:absolute;inset:0;background:#fff;opacity:0}

.ntag{position:absolute;background:#fff;border:5px solid #1d232b;border-radius:18px;box-shadow:0 7px 0 rgba(0,0,0,.25);padding:8px 20px 10px;text-align:center;opacity:0;white-space:nowrap;transform-origin:50% 100%}
.ntag:after{content:'';position:absolute;left:50%;bottom:-17px;margin-left:-13px;border:13px solid transparent;border-top-color:#1d232b;border-bottom:0}
.ntag .tt{font-family:Nunito;font-weight:900;font-size:30px;color:#1d232b}
.ntag .ts{font-family:Nunito;font-weight:900;font-size:27px;color:#2f7de1}
#votes{position:absolute;top:610px;left:50%;width:820px;margin-left:-410px;display:flex;flex-direction:column;gap:20px;opacity:0}
.vrow{background:#fff;border:5px solid #1d232b;border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);padding:14px 20px;display:flex;align-items:center;gap:16px;font-family:Nunito;font-weight:900;font-size:34px;color:#1d232b}
.vrow .lt{width:56px;height:56px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid #1d232b;flex:none}
.vrow .nm{width:250px}.vrow .bar{flex:1;height:30px;background:#e8e8e8;border-radius:15px;overflow:hidden}.vrow .bar i{display:block;height:100%;border-radius:15px}
.vrow .n{width:50px;text-align:right}
#namecard{position:absolute;top:640px;left:0;right:0;text-align:center;opacity:0}
#namecard .big{font-family:Lilita;font-size:200px;line-height:200px;color:#ffcc2e;-webkit-text-stroke:20px #15191f;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.35)}
#namecard .by{display:inline-block;margin-top:14px;background:#fff;border:5px solid #1d232b;border-radius:40px;padding:8px 28px;font-family:Nunito;font-weight:900;font-size:36px;color:#1d232b}
#laws{position:absolute;top:640px;left:50%;width:840px;margin-left:-420px;display:flex;flex-direction:column;gap:24px}
.law{background:#fff;border:5px solid #1d232b;border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:20px;padding:16px 24px;opacity:0;font-family:Nunito;font-weight:900;font-size:40px;color:#1d232b}
.law .lt{width:70px;height:70px;border-radius:50%;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;border:4px solid #1d232b;flex:none}
.law .em{font-family:'Noto Color Emoji';font-size:56px}

#bubbles{position:absolute;top:640px;left:50%;width:860px;margin-left:-430px;display:flex;flex-direction:column;gap:22px}
.bub{background:#fff;border:5px solid #1d232b;border-radius:26px;box-shadow:0 7px 0 rgba(0,0,0,.25);padding:14px 24px;opacity:0;font-family:Nunito;font-weight:900;color:#1d232b;max-width:760px;transform-origin:0 50%}
.bub:nth-child(even){align-self:flex-end;transform-origin:100% 50%}
.bub .bq{font-size:36px;line-height:42px}.bub .bu{font-size:24px;color:#2f7de1;margin-top:4px}
#goals{position:absolute;top:620px;left:50%;width:900px;margin-left:-450px;display:flex;flex-direction:column;gap:24px}
.goal{background:#fff;border:6px solid #1d232b;border-radius:28px;box-shadow:0 9px 0 rgba(0,0,0,.28);display:flex;align-items:center;gap:20px;padding:18px 24px;opacity:0;font-family:Nunito;font-weight:900;color:#1d232b;transition:none}
.goal.hot{background:#fff6d6;border-color:#15191f}
.goal .ge{font-family:'Noto Color Emoji';font-size:72px;flex:none}
.goal .gb{flex:1}.goal .gt{font-size:38px;line-height:42px}.goal .gs{font-size:28px;color:#555;margin:2px 0 10px}
.goal .bar{height:26px;background:#e8e8e8;border-radius:13px;overflow:hidden;border:3px solid #1d232b}.goal .bar i{display:block;height:100%}
.goal .gn{font-size:34px;width:110px;text-align:right}

.goal .gn{width:170px;font-size:30px;color:#2a9d3a}
#votes{top:1180px}
#before{position:absolute;top:590px;left:50%;width:480px;margin-left:-240px;opacity:0;transform-origin:50% 50%}
#before img{width:480px;display:block;border:12px solid #fff;border-radius:10px;box-shadow:0 14px 0 rgba(0,0,0,.3)}
#before .stamp{position:absolute;top:18px;left:18px;background:#1d232b;color:#fff;font-family:Nunito;font-weight:900;font-size:38px;padding:6px 18px;border-radius:10px}
#before .xmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Nunito;font-weight:900;font-size:340px;color:#e8334f;-webkit-text-stroke:14px #fff;paint-order:stroke fill;opacity:0}
</style>

// ---------- deterministic noise ----------
function hash(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=1,f=1,n=0;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);n+=a;a*=.5;f*=2.03;}return s/n;}
let seed=7; function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}

// ---------- world layout ----------
const V = new THREE.Vector2(-33,-42);   // volcano
const RIVER = [[0,-9],[12,12],[27,30],[18,60],[27,93],[36,126],[45,165]].map(p=>new THREE.Vector2(p[0],p[1]));
const M = new THREE.Vector2(54,66);     // meadow (ground shots)
const SITE_B = new THREE.Vector2(18,-45);
const RLEN=[0];for(let i=1;i<RIVER.length;i++)RLEN.push(RLEN[i-1]+RIVER[i].distanceTo(RIVER[i-1]));
function riverInfo(x,z){let best=1e9,bs=0;const p=new THREE.Vector2(x,z);
 for(let i=0;i<RIVER.length-1;i++){const a=RIVER[i],b=RIVER[i+1];const ab=b.clone().sub(a);const t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/ab.lengthSq()));
  const d=p.distanceTo(a.clone().addScaledVector(ab,t)); if(d<best){best=d;bs=(RLEN[i]+t*ab.length())/RLEN[RLEN.length-1];}}return [best,bs];}
function riverDist(x,z){return riverInfo(x,z)[0];}
const bed=s=>6.5*(1-s)+(-0.4)*s;
function rawH(x,z){
 const d=Math.hypot(x*1.0,z*0.92);
 const coast = 142 + (fbm(x*.0133+3,z*.0133+9)-.5)*60;
 let h = (1-Math.pow(Math.min(d/coast,1.6),2.2))*9 + (fbm(x*.027,z*.027)-.5)*6;
 const dv=Math.hypot(x-V.x,z-V.y);
 h += 52*Math.exp(-Math.pow(dv/39,1.6));
 if(dv<12) h -= (12-dv)*1.5;          // crater
 return h;}
function cityUV(x,z){const s=Math.hypot(SITE_A.x,SITE_A.y),sx=SITE_A.x/s,sz=SITE_A.y/s;const dx=x-SITE_A.x,dz=z-SITE_A.y;return [dx*(-sz)+dz*sx, -(dx*sx+dz*sz)];}
let CITY_READY=false;
const CITY_RECT={u0:-72,u1:72,v0:-2,v1:76};
function cityFlat(x,z){const [u,v]=cityUV(x,z);const du=Math.max(CITY_RECT.u0-u,0,u-CITY_RECT.u1),dv=Math.max(CITY_RECT.v0-v,0,v-CITY_RECT.v1);const d=Math.hypot(du,dv);
 const w=d<=0?1:Math.max(0,1-d/16);return [w*w*(3-2*w), 3.2+Math.max(0,v)*.05];}
function H(x,z){
 let h=rawH(x,z);
 if(CITY_READY){const [w,t]=cityFlat(x,z);if(w>0&&h>SEA-1)h=h*(1-w)+t*w;}
 const [rd,rs]=riverInfo(x,z);
 if(rd<9 && h>-1){const k=rd<3.6?1:Math.pow(1-(rd-3.6)/5.4,2);const b=bed(rs);h = h*(1-k) + Math.min(h,b)*k;}

const SEA=0.6;
const SITE_A=(()=>{const a=Math.atan2(70,-40);let r=20;while(rawH(Math.cos(a)*r,Math.sin(a)*r)>SEA+2.2&&r<230)r+=.5;r-=14;return new THREE.Vector2(Math.cos(a)*r,Math.sin(a)*r);})();
