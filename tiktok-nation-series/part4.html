// ---------- deterministic noise ----------

// ---------- world layout ----------
const V = new THREE.Vector2(-22,-28);   // volcano

// ---------- three setup ----------
const renderer = new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});

for(let i=0;i<pos.count;i+=3){

sea.rotation.x=-Math.PI/2; sea.position.y=SEA; scene.add(sea);
// river water

const rcurve=new THREE.CatmullRomCurve3(rpts);
{ const n=200, w=2.8, verts=[], idx=[];

   if(i<n){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);} }

// trees
function slope(x,z){return Math.hypot(H(x+1,z)-H(x-1,z),H(x,z+1)-H(x,z-1))/2;}
const pineG=new THREE.ConeGeometry(1.4,4.6,7); pineG.translate(0,3.3,0);

 if(Math.hypot(x-SITE_A.x,z-SITE_A.y)<66) continue; if([[-29, 0, 15], [-22, -11, 5], [-6, -14, 7], [3, -19, 8], [-50, -15, 10], [-58, -4, 11], [10, 11, 9], [28, 7, 8], [33, 26, 10], [-24, 31, 7], [-26, 20, 6], [-28, 10, 6], [-29, 0, 6], [-29, -9, 7]].some(c=>Math.hypot(x-c[0],z-c[1])<c[2])) continue;

inst(pineG,new THREE.MeshStandardMaterial({flatShading:true,roughness:.9}),pines,t=>new THREE.Color().setHSL(.32+t[4]*.04,.55,.22+t[4]*.08));
inst(trunkG,new THREE.MeshStandardMaterial({color:'#6b4a2b'}),pines.concat(rounds));
inst(roundG,new THREE.MeshStandardMaterial({flatShading:true,roughness:.9}),rounds,t=>new THREE.Color().setHSL(.26+t[4]*.05,.55,.38+t[4]*.08));

// grass blades + flowers around meadow
const MY=H(M.x,M.y);
{ const g=new THREE.ConeGeometry(.045,.55,3); g.translate(0,.27,0);
  const list=[]; for(let i=0;i<34000;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*32;const x=M.x+Math.cos(a)*r,z=M.y+Math.sin(a)*r;const y=H(x,z);if(y<SEA+1.3||riverDist(x,z)<3.5)continue;if([[10,12],[7,8],[4,6],[3,4.5],[-4,4],[-6,2]].some(q=>Math.hypot(x-M.x-q[0],z-M.y-q[1])<2.6))continue;list.push([x,y+.15,z,.6+rnd()*.9,rnd()]);}
  inst(g,new THREE.MeshStandardMaterial({flatShading:true}),list,t=>new THREE.Color().setHSL(.27+t[4]*.06,.6,.3+t[4]*.15)).castShadow=false;
  const fg=new THREE.IcosahedronGeometry(.09,0); fg.translate(0,.55,0); const fl=[];
  for(let i=0;i<700;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*28;const x=M.x+Math.cos(a)*r,z=M.y+Math.sin(a)*r;const y=H(x,z);if(y<SEA+1.3)continue;fl.push([x,y,z,1,rnd()]);}
