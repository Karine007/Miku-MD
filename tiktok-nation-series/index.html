const clouds=[]; const cm=new THREE.MeshStandardMaterial({color:'#ffffff',flatShading:true,roughness:1,emissive:'#ffffff',emissiveIntensity:.25});
function cloud(x,y,z,s){const g=new THREE.Group();for(let i=0;i<7;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(4+rnd()*4,1),cm);b.position.set((rnd()-.5)*18,(rnd()-.3)*4,(rnd()-.5)*8);g.add(b);}g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);clouds.push(g);return g;}
cloud(-70,80,40,1.2);cloud(60,90,-60,1.4);cloud(90,75,70,1);cloud(-90,85,-80,1.3);cloud(10,95,140,1.1);
// smoke over volcano
const smoke=[];for(let i=0;i<9;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(3,1),new THREE.MeshStandardMaterial({color:'#9a9a9a',flatShading:true,transparent:true,opacity:.85}));scene.add(b);smoke.push(b);}

// ghost buildings (room for millions)
const ghostMat=new THREE.MeshBasicMaterial({color:'#e4fbff',transparent:true,opacity:.38,depthWrite:false});
const edgeMat=new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:.9});
const ghosts=[];
for(let i=0;i<9000 && ghosts.length<520;i++){const x=(rnd()-.5)*190,z=(rnd()-.5)*190,y=H(x,z);if(y<SEA+1.5||y>22||riverDist(x,z)<5||Math.hypot(x-V.x,z-V.y)<20)continue;
 const w=2.5+rnd()*3,h=7+rnd()*16*(1-Math.hypot(x,z)/120),dd=2.5+rnd()*3;const bg=new THREE.BoxGeometry(w,Math.max(h,2),dd);bg.translate(0,Math.max(h,2)/2,0);
 const g=new THREE.Group();g.add(new THREE.Mesh(bg,ghostMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg),edgeMat));g.position.set(x,y,z);g.rotation.y=rnd()*1.5;g.userData.d=Math.hypot(x,z);g.visible=false;scene.add(g);ghosts.push(g);}
// ghost houses for capital sites
function house(){const g=new THREE.Group();const b=new THREE.BoxGeometry(3,2.4,3);b.translate(0,1.2,0);const r=new THREE.ConeGeometry(2.5,1.7,4);r.rotateY(Math.PI/4);r.translate(0,3.25,0);
 for(const geo of [b,r]){g.add(new THREE.Mesh(geo,ghostMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat));}return g;}
function site(c,n){const grp=new THREE.Group();for(let i=0;i<n;i++){const a=rnd()*6.283,r=3+Math.sqrt(rnd())*10;const x=c.x+Math.cos(a)*r,z=c.y+Math.sin(a)*r;const h=house();h.position.set(x,H(x,z),z);h.rotation.y=rnd()*3;h.scale.setScalar(.8+rnd()*.4);h.userData.k=i/n;grp.add(h);}
 const ring=new THREE.Mesh(new THREE.RingGeometry(13.5,14.2,64),new THREE.MeshBasicMaterial({color:'#fff',transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.set(c.x,Math.max(H(c.x,c.y),SEA)+1.2,c.y);grp.add(ring);
 grp.visible=false;scene.add(grp);return grp;}
const siteA=site(SITE_A,16), siteB=site(SITE_B,14);

// pawns
const pawns=[];const pcols=['#f2a33a','#30c2a8','#9b59d6','#e85d75','#3e8fe6','#f2d33a','#7bd65b','#ff8a4c'];
pcols.forEach((c,i)=>{const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:c,roughness:.5});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.7,6,12),mat);body.position.y=.7;const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),mat);head.position.y=1.55;
 g.add(body,head);g.traverse(o=>o.castShadow=true);g.visible=false;scene.add(g);pawns.push(g);});

// flag
const FLAG_P = new THREE.Vector3(M.x-8,0,M.y-10); FLAG_P.y=H(FLAG_P.x,FLAG_P.z);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,7,8),new THREE.MeshStandardMaterial({color:'#7a5534'}));pole.position.set(FLAG_P.x,FLAG_P.y+3.5,FLAG_P.z);pole.castShadow=true;
const knob=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshStandardMaterial({color:'#e7c34a',metalness:.4,roughness:.3}));knob.position.set(FLAG_P.x,FLAG_P.y+7.05,FLAG_P.z);
const fc=document.createElement('canvas');fc.width=512;fc.height=340;{const x=fc.getContext('2d');x.fillStyle='#f1f1ee';x.fillRect(0,0,512,340);x.fillStyle='#b9b9b9';x.font='bold 230px Lilita, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',256,180);}
const flagG=new THREE.PlaneGeometry(3.6,2.4,24,12);flagG.translate(1.8,0,0);
const flag=new THREE.Mesh(flagG,new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(fc),side:THREE.DoubleSide,roughness:.9}));flag.position.set(FLAG_P.x+.08,FLAG_P.y+5.6,FLAG_P.z);flag.castShadow=true;
const flagBase=flagG.attributes.position.array.slice();
const flagGrp=new THREE.Group();flagGrp.add(pole,knob,flag);flagGrp.visible=false;scene.add(flagGrp);

// ---------- timeline ----------
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const gy=(x,z)=>Math.max(H(x,z),SEA);
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const groundEye=(dx,dz,up=1.7)=>v3(M.x+dx,H(M.x+dx,M.y+dz)+up,M.y+dz);
const SH=[
 {t0:0,   t1:4.4, p:[v3(10,250,95),v3(-22,232,80)], l:[v3(0,0,8),v3(-4,0,6)]},
 {t0:4.4, t1:8.4, p:[v3(85,95,95),v3(62,84,80)], l:[v3(-14,36,-14),v3(-16,38,-18)]},
 {t0:8.4, t1:12.4,p:[v3(-40,150,150),v3(-10,135,140)], l:[v3(0,0,10),v3(0,0,6)]},
 {t0:12.4,t1:16, p:[groundEye(10,12),groundEye(7,8)], l:[v3(V.x,30,V.y),v3(V.x,28,V.y)]},
 {t0:16,  t1:20, p:[groundEye(4,6,1.5),groundEye(3,4.5,1.5)], l:[groundEye(-6,-8,2.2),groundEye(-6,-8,2.2)]},
 {t0:20,  t1:23.6,p:[groundEye(-4,4,1.1),groundEye(-6,2,1.1)], l:[v3(10,6,20),v3(8,6,18)]},
 {t0:23.6,t1:28.6,p:[v3(40,38,96),v3(30,34,62)], l:[v3(16,0,50),v3(10,0,22)]},
 {t0:28.6,t1:37.2,p:[v3(FLAG_P.x+2.6,FLAG_P.y+3.6,FLAG_P.z+13),v3(FLAG_P.x+2.2,FLAG_P.y+3.7,FLAG_P.z+11)], l:[v3(FLAG_P.x+1.8,FLAG_P.y+4.3,FLAG_P.z),v3(FLAG_P.x+1.8,FLAG_P.y+4.4,FLAG_P.z)]},
 {t0:37.2,t1:41.4,p:[v3(SITE_A.x+40,62,SITE_A.y+52),v3(SITE_A.x+32,54,SITE_A.y+44)], l:[v3(SITE_A.x,12,SITE_A.y),v3(SITE_A.x,12,SITE_A.y)]},
 {t0:41.4,t1:45.6,p:[v3(SITE_B.x+44,66,SITE_B.y+50),v3(SITE_B.x+36,60,SITE_B.y+42)], l:[v3(SITE_B.x-4,18,SITE_B.y-4),v3(SITE_B.x-4,18,SITE_B.y-4)]},
 {t0:45.6,t1:51, p:[v3(30,130,150),v3(40,240,175)], l:[v3(-4,0,10),v3(-4,0,8)]},
];
const DUR=51;
const caps=[ // [id, start, end, text]
 ['c1',0.15,4.4,TXT.s1],
 ['c2',4.7,8.4,TXT.s2],
 ['c2',8.6,12.4,TXT.s3],
 ['c2',12.7,16,TXT.s4],
 ['c2',16.3,20,TXT.s5],
 ['c2',20.2,23.6,TXT.s6],
 ['c1',23.8,28.6,TXT.s7],
 ['c1',28.8,37.2,TXT.s8],
 ['c2',34.6,37.2,TXT.s8b],
 ['c1',37.4,45.6,TXT.s9],
 ['c2',38.0,41.4,TXT.a],
 ['c2',41.7,45.6,TXT.b],
 ['c2',45.9,48.2,TXT.s10],
 ['c2',48.2,DUR,TXT.s10b],
];
window.CAPTION_TIMES = [...new Set(caps.map(c=>c[1]))].concat([25,25.35,25.7,26.05,30.4,31.6,32.8,38.3,41.9]);
window.CUTS = SH.map(s=>s.t0);
function popAt(el,t,a,b,{inDur=.28,outDur=.15,scale=true}={}){
 if(t<a||t>b){el.style.opacity=0;return 0;}
 const k=clamp((t-a)/inDur), ko=clamp((b-t)/outDur);
 const s= k<1 ? (k<.6? .55+ .6*(k/.6) : 1.15-.15*((k-.6)/.4)) : 1;
 el.style.opacity=Math.min(k*2,ko,1); if(scale) el.style.transform=`scale(${s})`; return 1;}
const proj=(v)=>{const p=v.clone().project(camera);return [(p.x+1)/2*1080,(1-p.y)/2*1920,p.z];};

window.setTime = function(t){
 // camera
 const sh=SH.find(s=>t>=s.t0&&t<s.t1)||SH[SH.length-1];
 const k=ease(clamp((t-sh.t0)/(sh.t1-sh.t0)));
 camera.position.lerpVectors(sh.p[0],sh.p[1],k);
 const look=new THREE.Vector3().lerpVectors(sh.l[0],sh.l[1],k);
 camera.lookAt(look);
 camera.fov = sh===SH[3]||sh===SH[4]||sh===SH[5]? 55 : 42; camera.updateProjectionMatrix();

 // environment animation
 clouds.forEach((c,i)=>{c.position.x += 0; c.userData.bx??=c.position.x; c.position.x=c.userData.bx + t*1.2*(i%2?1:-1);});
 smoke.forEach((b,i)=>{const ph=((t*.12+i/smoke.length)%1);b.position.set(V.x+ph*14+Math.sin(i*3)*2,H(V.x,V.y)+4+ph*30,V.y-ph*6);b.scale.setScalar(.6+ph*2.2);b.material.opacity=.8*(1-ph);});
 lava.material.color.setHSL(.06,1,.5+.06*Math.sin(t*4));
 // final shot: clouds sweep in front
 const fin=clamp((t-45.6)/5.4);
 clouds[4].position.set(-30+fin*60,95+fin*60,120+fin*20);

 // ghost buildings
 const gOn = t>=8.4&&t<12.4;
 ghosts.forEach(g=>{g.visible=gOn; if(gOn){const s=clamp((t-8.6-g.userData.d/70)*2.2);g.scale.set(1,Math.max(s,.001),1);}});
 // pawns
 const pOn=t>=16&&t<20;
 pawns.forEach((p,i)=>{p.visible=pOn&&t>16.4+i*.32; if(p.visible){const fw=new THREE.Vector3();camera.getWorldDirection(fw);fw.y=0;fw.normalize();const rt=new THREE.Vector3(-fw.z,0,fw.x);const off=(i-3.5)*1.25,dist=8+((i*5)%4)*1.5;const x=camera.position.x+fw.x*dist+rt.x*off,z=camera.position.z+fw.z*dist+rt.z*off;
   const ap=clamp((t-16.4-i*.32)/.3);const bob=Math.abs(Math.sin(t*5+i))*.12;p.position.set(x,H(x,z)+bob+(1-ap)*1.5,z);p.scale.setScalar(.95*(.3+.7*ap));p.lookAt(camera.position.x,p.position.y,camera.position.z);}});
 // flag
 flagGrp.visible = t>=28.6&&t<37.2;
 if(flagGrp.visible){const a=flagG.attributes.position.array;for(let i=0;i<a.length;i+=3){const x=flagBase[i];a[i+2]=Math.sin(x*1.6-t*5)*.22*(x/3.6);a[i+1]=flagBase[i+1]-x*.03;}flagG.attributes.position.needsUpdate=true;flagG.computeVertexNormals();}
 // sites
 siteA.visible = (t>=37.2&&t<41.4)||t>=45.6; siteB.visible=(t>=41.4&&t<45.6)||t>=45.6;
 for(const [s,t0] of [[siteA,37.5],[siteB,41.7]]){s.children.forEach(h=>{if(h.userData.k===undefined)return;const local=t>=45.6?1:clamp((t-t0-h.userData.k*1.6)/.35);h.scale.setScalar(Math.max(local,.001)*(.8+h.userData.k*.3));});}

 renderer.render(scene,camera);

 // ---------- UI ----------
 const used={c1:false,c2:false};
 for(const [id,a,b,txt] of caps){ if(t>=a&&t<=b){const el=$(id); if(el.dataset.txt!==txt){el.innerHTML=txt;el.dataset.txt=txt;} popAt(el,t,a,b); used[id]=true; } }
 for(const id in used) if(!used[id]) $(id).style.opacity=0;
 // population counter
 let pop=0; if(t>=16&&t<20) pop=Math.min(8,Math.max(0,Math.floor((t-16.4)/.32)+1));
 $('popn').textContent=pop; $('tag').style.opacity = (t>=16.4&&t<20)?1:0;
 // volcano label
 const labOn=t>=5.2&&t<8.4; const lab=$('lab'), ld=$('leader');
 if(labOn){const pk=proj(v3(V.x,H(V.x,V.y)+6,V.y)); const lx=pk[0]+170, ly=pk[1]-90; lab.style.left=(lx-20)+'px'; lab.style.top=(ly-52)+'px'; popAt(lab,t,5.2,8.4);
   ld.setAttribute('x1',pk[0]);ld.setAttribute('y1',pk[1]);ld.setAttribute('x2',lx);ld.setAttribute('y2',ly);ld.setAttribute('opacity',clamp((t-5.2)/.3));}
 else{lab.style.opacity=0;ld.setAttribute('opacity',0);}
 // vote cards
 [...$('grid').children].forEach((c,i)=>popAt(c,t,25+i*.35,28.6));
 // steps + comment
 [...$('steps').children].forEach((c,i)=>popAt(c,t,30.4+i*1.2,37.2));
 popAt($('comment'),t,32.8,37.2);
 $('likes').textContent = t<33.2?'0': Math.floor(1240*Math.pow(clamp((t-33.2)/2.4),.7)).toLocaleString('en-US');
 // pins
 const pinA=$('pinA'),pinB=$('pinB');
 for(const [el,s,on,ta] of [[pinA,SITE_A,(t>=37.2&&t<41.4)||t>=45.6,37.4],[pinB,SITE_B,(t>=41.4&&t<45.6)||t>=45.6,41.6]]){
   if(!on){el.style.opacity=0;continue;} const pp=proj(v3(s.x,gy(s.x,s.y)+(t>=45.6?3:4),s.y)); const big=t>=45.6?.75:1.4;
   const st=t>=45.6?45.8+(el===pinB?.25:0):ta; const k=clamp((t-st)/.3); const b=k<1?(.5+.7*k):1;
   el.style.left=pp[0]+'px'; el.style.top=(pp[1]-(1-k)*40)+'px'; el.style.opacity=k; el.style.transform=`scale(${big*b})`; el.style.transformOrigin='50% 100%';}
 // flash on cuts
 let fl=0; for(const c of window.CUTS){ if(c>0&&t>=c&&t<c+.12) fl=.5*(1-(t-c)/.12);} $('flash').style.opacity=fl;
};
window.DUR=DUR; window.__T={THREE,camera,renderer,scene,V,H,SITE_A,SITE_B,siteA,siteB,flagGrp,clouds,SEA};
document.fonts.ready.then(()=>{window.setTime(0);window.READY=true;});
</script>
